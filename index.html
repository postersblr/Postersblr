<!-- POSTER CATEGORIES -->
<div class="poster-categories">
  <h2>Shop Posters</h2>

  <div class="category-buttons">
    <button onclick="filterPosters('all')">All Posters</button>
    <button onclick="filterPosters('marvel')">Marvel</button>
    <button onclick="filterPosters('dc')">DC</button>
    <button onclick="filterPosters('ronaldo')">Ronaldo</button>
    <button onclick="filterPosters('messi')">Messi</button>
    <button onclick="filterPosters('virat')">Virat Kohli</button>
    <button onclick="filterPosters('spiderman')">Spiderman</button>
    <button onclick="filterPosters('travel')">Travel</button>
    <button onclick="filterPosters('gym')">Gym</button>
    <button onclick="filterPosters('motivation')">Motivation</button>
  </div>
</div>

<style>
.poster-categories {
  text-align: center;
  margin: 35px auto;
  padding: 0 15px;
}

.poster-categories h2 {
  font-size: 28px;
  margin-bottom: 20px;
}

.category-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.category-buttons button {
  border: none;
  padding: 11px 20px;
  border-radius: 25px;
  background: #f1f1f1;
  color: #222;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
}

.category-buttons button:hover {
  transform: translateY(-2px);
  background: #222;
  color: white;
}
</style>

<script>
function filterPosters(category) {
  const posters = document.querySelectorAll(".poster");

  posters.forEach(poster => {
    if (category === "all" || poster.dataset.category === category) {
      poster.style.display = "block";
    } else {
      poster.style.display = "none";
    }
  });
}
</script>
</html>
