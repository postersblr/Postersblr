<!-- POSTER TYPES -->
<section class="poster-types">
  <h2>Poster Types</h2>

  <div class="type-buttons">
    <button onclick="filterPosters('all')">All</button>
    <button onclick="filterPosters('marvel')">Marvel</button>
    <button onclick="filterPosters('dc')">DC</button>
    <button onclick="filterPosters('ronaldo')">Ronaldo</button>
    <button onclick="filterPosters('messi')">Messi</button>
    <button onclick="filterPosters('virat')">Virat Kohli</button>
    <button onclick="filterPosters('spiderman')">Spiderman</button>
    <button onclick="filterPosters('travel')">Travel</button>
    <button onclick="filterPosters('gym')">Gym</button>
    <button onclick="filterPosters('motivation')">Motivation</button>
  </div>
</section>

<style>
.poster-types {
  text-align: center;
  margin: 30px 0;
}

.poster-types h2 {
  font-size: 28px;
  margin-bottom: 18px;
}

.type-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.type-buttons button {
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 15px;
  background: #eeeeee;
  transition: 0.2s;
}

.type-buttons button:hover {
  transform: translateY(-2px);
}
</style>

<script>
function filterPosters(type) {
  console.log("Selected poster type:", type);
}
</script>
</html>
